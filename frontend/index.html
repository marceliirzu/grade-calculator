<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F7FA">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Free GPA calculator for college students. Paste your syllabus to auto-detect grading categories, track grades across all classes, and calculate your GPA in real time.">
    <meta property="og:title" content="CalcYourGPA - Free GPA & Grade Calculator">
    <meta property="og:description" content="Paste a syllabus to auto-detect grading categories, track every class, and watch your GPA update in real time. Built for students.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://calcyourgpa.com">
    <meta name="robots" content="index, follow">
    <title>CalcYourGPA - Free GPA & Grade Calculator</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235249E0'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='12' fill='white'%3EGPA%3C/text%3E%3C/svg%3E">

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Fonts: Instrument Serif (display) + Schibsted Grotesk (UI) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/modals.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/components/grade-scale.css">
    <link rel="stylesheet" href="css/components/grade-advisor.css">
    <link rel="stylesheet" href="css/pages/landing.css">
    <link rel="stylesheet" href="css/pages/class-setup.css">
    <link rel="stylesheet" href="css/pages/class-detail.css">
    <link rel="stylesheet" href="css/pages/category-editor.css">
    <link rel="stylesheet" href="css/pages/semester.css">

    <style>
        body { opacity: 0; transition: opacity 0.3s ease; }
        body.loaded { opacity: 1; }

        /* Logo */
        .logo-container {
            display: flex;
            align-items: center;
            gap: var(--spacing-2-5);
            cursor: pointer;
            text-decoration: none;
        }

        .logo-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            background: linear-gradient(140deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .logo-mark-text {
            font-family: var(--font-family-mono);
            font-size: 11px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .logo-text {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--color-text-primary);
            letter-spacing: -0.02em;
        }

        .logo-text-muted {
            color: var(--color-text-muted);
            font-weight: 500;
        }

        /* A+ Toggle */
        .aplus-toggle {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            padding: var(--spacing-1-5) var(--spacing-2) var(--spacing-1-5) var(--spacing-3);
            background: var(--color-bg-card);
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--transition-spring);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-xs);
        }

        .aplus-toggle:hover {
            border-color: var(--color-border-light);
            box-shadow: var(--shadow-sm);
        }
        .aplus-toggle:active { transform: scale(0.96); }

        .aplus-toggle .toggle-label {
            font-weight: 500;
        }

        .aplus-toggle .toggle-value {
            background: var(--color-primary-subtle);
            color: var(--color-primary);
            padding: 2px 9px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-family: var(--font-family-mono);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-container" id="logoContainer">
                    <div class="logo-mark">
                        <span class="logo-mark-text" id="logoMarkText">GPA</span>
                    </div>
                    <span class="logo-text"><b>Calc</b>Your<b>GPA</b></span>
                </div>
                <div class="user-menu" id="userMenu">
                    <!-- A+ Toggle loads here -->
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent"></main>

        <!-- Modal Container -->
        <div id="modalContainer"></div>
    </div>

    <!-- JavaScript -->
    <script src="env.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/utils/validation.js"></script>
    <script src="js/utils/formatters.js"></script>
    <script src="js/parsers/syllabusParser.js"></script>
    <script src="js/parsers/gradebookParser.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/services/authService.js"></script>
    <script src="js/services/classService.js"></script>
    <script src="js/services/categoryService.js"></script>
    <script src="js/services/gradeService.js"></script>
    <script src="js/services/syllabusService.js"></script>
    <script src="js/services/semesterService.js"></script>
    <script src="js/services/gradeAdvisorService.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/classCard.js"></script>
    <script src="js/components/gpaDisplay.js"></script>
    <script src="js/components/gradeScaleEditor.js"></script>
    <script src="js/components/categoryCard.js"></script>
    <script src="js/components/gradeEntry.js"></script>
    <script src="js/components/rulesEditor.js"></script>
    <script src="js/components/gradeAdvisor.js"></script>
    <script src="js/pages/landing.js"></script>
    <script src="js/pages/classSetup.js"></script>
    <script src="js/pages/classDetail.js"></script>
    <script src="js/pages/categoryEditor.js"></script>
    <script src="js/pages/semesterList.js"></script>
    <script src="js/pages/semesterHistory.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.body.classList.add('loaded');
    </script>
</body>
</html>
