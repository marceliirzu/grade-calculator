name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    # The backend deploys itself from Railway, so a backend-only change should not
    # rebuild and republish the site.
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never publish two builds at once, and let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `install`) so the lockfile is authoritative and a deploy can never
      # silently pick up a different dependency version than CI tested.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The site must not ship if the grading engine disagrees with the shared vectors.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          # Repository variables, not secrets: both values are public by design and are
          # inlined into the bundle. Secrets would be redacted in logs for no benefit and
          # would wrongly imply the built site keeps them private.
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL repository variable is not set."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables"
            echo "to your Railway API URL including the /api suffix."
            exit 1
          fi
          npm run build

      # A custom domain needs this file, and Pages drops it on every deploy without it.
      - name: Add CNAME
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > frontend/dist/CNAME

      # The SPA has no server-side routing, so a direct hit on any path must still serve
      # the app shell rather than a 404.
      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
